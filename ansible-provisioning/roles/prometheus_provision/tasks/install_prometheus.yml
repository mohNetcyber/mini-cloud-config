---
- name: Creer l'utilisateur systeme prometheus
  ansible.builtin.user:
    name: prometheus
    system: yes
    shell: /usr/sbin/nologin
    create_home: no

- name: Creer les repertoires necessaires
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
  loop: [/etc/prometheus, /var/lib/prometheus]

- name: Telecharger et extraire Prometheus
  ansible.builtin.unarchive:
    src: https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
    dest: /tmp
    remote_src: yes
    creates: /tmp/prometheus-2.53.0.linux-amd64

- name: Installer les binaires
  ansible.builtin.copy:
    src: "/tmp/prometheus-2.53.0.linux-amd64/{{ item }}"
    dest: /usr/local/bin/
    remote_src: yes
    mode: '0755'
    owner: prometheus
  loop: [prometheus, promtool]

- name: Deposer le token et le CA recuperes depuis VM1
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: prometheus
    mode: "{{ item.mode }}"
  loop:
    - {content: "{{ prom_bearer_token }}", dest: /etc/prometheus/k3s-bearer-token, mode: '0600'}
    - {content: "{{ k3s_ca_content }}", dest: /etc/prometheus/k3s-ca.crt, mode: '0644'}
  no_log: true