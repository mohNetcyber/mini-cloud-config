---
- name: Creer le RBAC Prometheus dans le cluster
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ item }}"
  loop:
    - apiVersion: v1
      kind: Namespace
      metadata: {name: monitoring}
    - apiVersion: v1
      kind: ServiceAccount
      metadata: {name: prometheus, namespace: monitoring}
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: prometheus-read-only}
      rules:
        - apiGroups: [""]
          resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
          verbs: ["get", "list", "watch"]
        - nonResourceURLs: ["/metrics"]
          verbs: ["get"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: {name: prometheus-read-only-binding}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-read-only}
      subjects:
        - {kind: ServiceAccount, name: prometheus, namespace: monitoring}
    - apiVersion: v1
      kind: Secret
      metadata:
        name: prometheus-sa-token
        namespace: monitoring
        annotations: {kubernetes.io/service-account.name: prometheus}
      type: kubernetes.io/service-account-token
  delegate_to: vm1

- name: Recuperer le token du compte de service
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: Secret
    name: prometheus-sa-token
    namespace: monitoring
  register: prom_secret
  delegate_to: vm1

- name: Exposer le token comme fait
  ansible.builtin.set_fact:
    prom_bearer_token: "{{ prom_secret.resources[0].data.token | b64decode }}"

- name: Lire le certificat CA de K3s
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/tls/server-ca.crt
  register: k3s_ca_raw
  delegate_to: vm1

- name: Exposer le CA comme fait
  ansible.builtin.set_fact:
    k3s_ca_content: "{{ k3s_ca_raw.content | b64decode }}"