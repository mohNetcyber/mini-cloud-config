---
- name: Deployer une config minimale de demarrage (le vrai contenu vient du pipeline CI/CD)
  ansible.builtin.copy:
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    mode: '0644'
    force: no
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

- name: Deployer un fichier de regles vide (evite une erreur au demarrage)
  ansible.builtin.copy:
    dest: /etc/prometheus/alert.rules.yml
    owner: prometheus
    mode: '0644'
    force: no
    content: |
      groups: []

- name: Deployer le service systemd
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    content: |
      [Unit]
      Description=Prometheus Monitoring
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --web.listen-address=0.0.0.0:9090 \
        --web.enable-lifecycle
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Redemarrer et activer Prometheus