---
- name: Deployer kube-state-metrics (RBAC + Application) et le service metrics Traefik
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ item }}"
  loop:
    # 1. Compte de service pour kube-state-metrics
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: kube-state-metrics
        namespace: monitoring

    # 2. Rôle d'accès pour kube-state-metrics
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: kube-state-metrics
      rules:
        - apiGroups: [""]
          resources: ["pods", "nodes", "services", "endpoints", "namespaces", "resourcequotas", "persistentvolumeclaims", "persistentvolumes"]
          verbs: ["list", "watch"]
        - apiGroups: ["apps"]
          resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
          verbs: ["list", "watch"]
        - apiGroups: ["batch"]
          resources: ["jobs", "cronjobs"]
          verbs: ["list", "watch"]

    # 3. Liaison du rôle au compte de service
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: kube-state-metrics
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: kube-state-metrics
      subjects:
        - kind: ServiceAccount
          name: kube-state-metrics
          namespace: monitoring

    # 4. Déploiement de kube-state-metrics (avec son ServiceAccount associé)
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kube-state-metrics
        namespace: monitoring
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: kube-state-metrics
        template:
          metadata:
            labels:
              app: kube-state-metrics
          spec:
            serviceAccountName: kube-state-metrics
            containers:
              - name: kube-state-metrics
                image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
                ports:
                  - containerPort: 8080
                    name: http-metrics

    # 5. Service NodePort pour exposer kube-state-metrics vers la VM3
    - apiVersion: v1
      kind: Service
      metadata:
        name: kube-state-metrics
        namespace: monitoring
      spec:
        type: NodePort
        selector:
          app: kube-state-metrics
        ports:
          - port: 8080
            targetPort: 8080
            nodePort: 30081

    # 6. Service NodePort pour exposer les métriques Traefik existantes vers la VM3
    - apiVersion: v1
      kind: Service
      metadata:
        name: traefik-metrics
        namespace: traefik
      spec:
        type: NodePort
        selector:
          app.kubernetes.io/name: traefik
        ports:
          - port: 9100
            targetPort: 9100
            nodePort: 30090
  delegate_to: vm1

