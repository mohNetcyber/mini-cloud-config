- name: Installer les CRD Gateway API
  kubernetes.core.k8s:
    state: present
    src: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.1.0/standard-install.yaml
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Ajouter le depot Helm Traefik
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: https://traefik.github.io/charts

- name: Creer le namespace traefik
  kubernetes.core.k8s:
    name: traefik
    api_version: v1
    kind: Namespace
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Generer le certificat auto-signe
  become: true
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 365
    -newkey rsa:2048
    -keyout /tmp/tls.key
    -out /tmp/tls.crt
    -subj "/CN=*.minicloud.local"
    -addext "subjectAltName=DNS:*.minicloud.local,DNS:minicloud.local"
  args:
    creates: /tmp/tls.crt

- name: Lire le certificat TLS
  ansible.builtin.slurp:
    src: /tmp/tls.crt
  register: tls_crt

- name: Lire la cle privee TLS
  ansible.builtin.slurp:
    src: /tmp/tls.key
  register: tls_key

- name: Creer le secret TLS dans le cluster
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/tls
      metadata:
        name: local-selfsigned-tls
        namespace: traefik
      data:
        tls.crt: "{{ tls_crt.content }}"
        tls.key: "{{ tls_key.content }}"

- name: Installer Traefik via Helm
  kubernetes.core.helm:
    name: traefik
    chart_ref: traefik/traefik
    release_namespace: traefik
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      ports:
        web:
          port: 8000
          expose:
            default: true
          exposedPort: 80
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
                permanent: true
        websecure:
          port: 8443
          expose:
            default: true
          exposedPort: 443
        traefik:
          port: 9000

      api:
        dashboard: true
        insecure: false

      ingressRoute:
        dashboard:
          enabled: true
          matchRule: Host(`traefik.minicloud.local`)
          entryPoints:
            - websecure
          middlewares:
            - name: dashboard-auth
          tls:
            secretName: local-selfsigned-tls

      extraObjects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: dashboard-auth-secret
            namespace: traefik
          type: kubernetes.io/basic-auth
          stringData:
            username: admin
            password: "{{ traefik_dashboard_password }}"
        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: dashboard-auth
            namespace: traefik
          spec:
            basicAuth:
              secret: dashboard-auth-secret

      ingressClass:
        enabled: false

      providers:
        kubernetesCRD:
          enabled: true
        kubernetesGateway:
          enabled: true
        kubernetesIngress:
          enabled: false

      gateway:

        # Active la création automatique de l'infrastructure par la Gateway
        autoProvision: true
        listeners:
          web:
            port: 8000
            protocol: HTTP
            namespacePolicy:
              from: All
          websecure:
            port: 8443
            protocol: HTTPS
            mode: Terminate
            namespacePolicy:
              from: All
            certificateRefs:
              - kind: Secret
                name: local-selfsigned-tls
                group: ""

      deployment:
        replicas: 1

      service:
        type: LoadBalancer

      log:
        level: INFO

      accessLog:
        enabled: true

      metrics:
        prometheus:
          enabled: true
