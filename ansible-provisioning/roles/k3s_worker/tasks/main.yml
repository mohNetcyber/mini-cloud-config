- name: Recuperer le token directement sur VM1
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_delegate
  delegate_to: vm1
  become: yes

- name: Installer K3s agent et rejoindre le cluster
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL=stable \
      K3S_URL=https://192.168.100.10:6443 \
      K3S_TOKEN={{ k3s_token_delegate.content | b64decode | trim }} \
      sh -s - agent \
      --node-ip=192.168.100.11 \
      --node-name=vm2-k3s-worker
  args:
    creates: /etc/systemd/system/k3s-agent.service
  no_log: true
