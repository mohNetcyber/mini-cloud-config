name: CI - Build, Scan and Deploy Image

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_name: ${{ steps.image-name.outputs.image_name }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Normaliser le nom de l'image GHCR
        id: image-name
        shell: bash
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}/mini-cloud-app" >> "$GITHUB_OUTPUT"

      - name: Build de l'image pour le scan
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: false
          load: true
          tags: mini-cloud-app:scan-temp

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mini-cloud-app:scan-temp
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Connexion a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push de l'image apres le scan
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.image-name.outputs.image_name }}:${{ github.sha }}
            ${{ steps.image-name.outputs.image_name }}:latest

      - name: Publier le tag de l'image
        id: image
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy-k3s:
    runs-on: self-hosted
    needs: build-scan-push
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Creer ou mettre a jour le secret de pull GHCR
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.repository_owner }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Appliquer le deployment de l'application
        run: |
          kubectl apply -f k3s/manifests/deployment-test.yaml
          kubectl set image deployment/app-test \
            app-test=${{ needs.build-scan-push.outputs.image_name }}:${{ needs.build-scan-push.outputs.image_tag }}
          kubectl rollout status deployment/app-test --timeout=180s