name: Deploy Config Files

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      k3s: ${{ steps.filter.outputs.k3s }}
      prometheus: ${{ steps.filter.outputs.prometheus }}
      grafana: ${{ steps.filter.outputs.grafana }}
      wazuh: ${{ steps.filter.outputs.wazuh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detecter les fichiers modifies
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            k3s:
              - 'k3s/**'
            prometheus:
              - 'prometheus/**'
            grafana:
              - 'grafana/**'
            wazuh:
              - 'wazuh/**'

  deploy-k3s:
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.k3s == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer les manifests K3s
        run: |
          kubectl apply -f k3s/manifests/
          kubectl rollout restart deployment/app-test
          kubectl rollout status deployment/app-test --timeout=180s

  deploy-prometheus:
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.prometheus == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Charger la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 192.168.100.12 >> ~/.ssh/known_hosts
      - name: Copier la config vers VM3
        run: |
          scp -i ~/.ssh/deploy_key prometheus/prometheus.yml traore-karym@192.168.100.12:/etc/prometheus/prometheus.yml
          scp -i ~/.ssh/deploy_key prometheus/alert.rules.yml traore-karym@192.168.100.12:/etc/prometheus/alert.rules.yml
      - name: Recharger Prometheus à chaud
        run: |
          ssh -i ~/.ssh/deploy_key traore-karym@192.168.100.12 "curl -X POST http://localhost:9090/-/reload"

  deploy-grafana:
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.grafana == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Charger la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 192.168.100.12 >> ~/.ssh/known_hosts
      - name: Copier la config et les dashboards vers VM3
        run: |
          scp -i ~/.ssh/deploy_key -r grafana/provisioning/* traore-karym@192.168.100.12:/etc/grafana/provisioning/
          scp -i ~/.ssh/deploy_key grafana/dashboards/*.json traore-karym@192.168.100.12:/var/lib/grafana/dashboards/ 2>/dev/null || true
      - name: Redémarrer Grafana
        run: |
          ssh -i ~/.ssh/deploy_key traore-karym@192.168.100.12 "sudo systemctl restart grafana-server"

  deploy-wazuh:
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.wazuh == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Charger la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 192.168.100.13 >> ~/.ssh/known_hosts
      - name: Copier la config vers VM4
        run: |
          scp -i ~/.ssh/deploy_key wazuh/ossec.conf traore-karym@192.168.100.13:/tmp/ossec.conf
          scp -i ~/.ssh/deploy_key wazuh/local_rules.xml traore-karym@192.168.100.13:/tmp/local_rules.xml
      - name: Appliquer et redémarrer le manager Wazuh
        run: |
          ssh -i ~/.ssh/deploy_key traore-karym@192.168.100.13 "
            sudo cp /tmp/ossec.conf /var/ossec/etc/ossec.conf &&
            sudo cp /tmp/local_rules.xml /var/ossec/etc/rules/local_rules.xml &&
            sudo systemctl restart wazuh-manager
          "
