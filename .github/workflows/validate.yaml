name: Validate Config Files

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valider les manifests K3s
        run: |
          # Téléchargement sécurisé et stable de kubeconform
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # Correction : Ajout du drapeau -r pour parcourir récursivement les sous-dossiers
          ./kubeconform -summary -r k3s/manifests/

      - name: Valider prometheus.yml (si présent)
        run: |
          if [ -f prometheus/prometheus.yml ]; then
            # Téléchargement uniquement de promtool pour gagner du temps
            curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz | tar xz --strip-components=1 */promtool
            ./promtool check config prometheus/prometheus.yml
          else
            echo "prometheus.yml absent, etape ignoree (VM3 pas encore installee)"
          fi

      - name: Valider les fichiers Wazuh (si présents)
        run: |
          # Correction : Vérification et validation de TOUS les fichiers XML présents
          shopt -s nullglob
          xml_files=(wazuh/*.conf wazuh/*.xml)
          if [ ${#xml_files[@]} -gt 0 ]; then
            sudo apt-get update && sudo apt-get install -y libxml2-utils
            for f in "${xml_files[@]}"; do
              xmllint --noout "$f"
            done
          else
            echo "Fichiers Wazuh absents, etape ignoree (VM4 pas encore installee)"
          fi

      - name: Valider les JSON Grafana (si présents)
        run: |
          shopt -s nullglob
          files=(grafana/dashboards/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucun dashboard Grafana, etape ignoree"
          else
            # Correction : Utilisation de jq pour une validation stricte qui lève une erreur
            for f in "${files[@]}"; do
              jq empty "$f"
            done
          fi
