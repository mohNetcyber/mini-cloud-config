name: Validate Config Files

on:
  push:
    branches: [main]
    paths:
      - 'k3s/**'
      - 'prometheus/**'
      - 'wazuh/**'
      - 'grafana/**'
      - '.github/workflows/validate.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valider les manifests K3s
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          chmod +x kubeconform
          ./kubeconform -summary -ignore-missing-schemas k3s/manifests/

      - name: Valider prometheus.yml (si présent)
        run: |
          if [ -f prometheus/prometheus.yml ]; then
            prometheus_tag="$(curl -fsSL https://api.github.com/repos/prometheus/prometheus/releases/latest | jq -r '.tag_name')"
            prometheus_version="${prometheus_tag#v}"
            prometheus_archive="prometheus-${prometheus_version}.linux-amd64.tar.gz"
            curl -fsSL "https://github.com/prometheus/prometheus/releases/download/${prometheus_tag}/${prometheus_archive}" -o "$prometheus_archive"
            tar xzf "$prometheus_archive"

            validation_dir="$(mktemp -d)"
            trap 'rm -rf "$validation_dir"' EXIT
            cp prometheus/prometheus.yml prometheus/alert.rules.yml "$validation_dir/"
            printf 'ci-validation-token\n' > "$validation_dir/k3s-bearer-token"
            sed -i \
              -e "s#/etc/prometheus/k3s-bearer-token#$validation_dir/k3s-bearer-token#g" \
              -e 's#/etc/prometheus/k3s-ca.crt#/etc/ssl/certs/ca-certificates.crt#g' \
              "$validation_dir/prometheus.yml"
            "./prometheus-${prometheus_version}.linux-amd64/promtool" check config "$validation_dir/prometheus.yml"
          else
            echo "prometheus.yml absent, etape ignoree (VM3 pas encore installee)"
          fi

      - name: Valider les fichiers Wazuh (si présents)
        shell: bash
        run: |
          shopt -s nullglob
          xml_files=(wazuh/*.conf wazuh/*.xml)

          if [ ${#xml_files[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y libxml2-utils

            for f in "${xml_files[@]}"; do
              echo "Validation de $f"

              if [[ "$f" == *.conf || "$f" == *local_rules.xml ]]; then
                # Wazuh peut utiliser plusieurs blocs <ossec_config> ou plusieurs <group>.
                # On les encapsule temporairement dans une racine XML unique.
                {
                  echo '<wazuh_config>'
                  cat "$f"
                  echo '</wazuh_config>'
                } > /tmp/wazuh-validation.xml

                xmllint --noout /tmp/wazuh-validation.xml
              else
                xmllint --noout "$f"
              fi
            done
          else
            echo "Fichiers Wazuh absents, étape ignorée (VM4 pas encore installée)"
          fi

      - name: Valider les JSON Grafana (si présents)
        shell: bash
        run: |
          shopt -s nullglob
          files=(grafana/dashboards/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucun dashboard Grafana, etape ignoree"
          else
            for f in "${files[@]}"; do
              jq empty "$f"
            done
          fi
