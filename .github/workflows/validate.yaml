name: Validate Config Files

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valider les manifests K3s
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          chmod +x kubeconform
          ./kubeconform -summary -ignore-missing-schemas k3s/manifests/

      - name: Valider prometheus.yml (si présent)
        run: |
          if [ -f prometheus/prometheus.yml ]; then
            curl -sSL https://github.com/prometheus/prometheus/releases/latest/download/prometheus-linux-amd64.tar.gz | tar xz
            ./prometheus-linux-amd64/promtool check config prometheus/prometheus.yml
          else
            echo "prometheus.yml absent, etape ignoree (VM3 pas encore installee)"
          fi

      - name: Valider les fichiers Wazuh (si présents)
        shell: bash
        run: |
          shopt -s nullglob
          xml_files=(wazuh/*.conf wazuh/*.xml)
          if [ ${#xml_files[@]} -gt 0 ]; then
            sudo apt-get update && sudo apt-get install -y libxml2-utils
            for f in "${xml_files[@]}"; do
              xmllint --noout "$f"
            done
          else
            echo "Fichiers Wazuh absents, etape ignoree (VM4 pas encore installee)"
          fi

      - name: Valider les JSON Grafana (si présents)
        shell: bash
        run: |
          shopt -s nullglob
          files=(grafana/dashboards/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucun dashboard Grafana, etape ignoree"
          else
            for f in "${files[@]}"; do
              jq empty "$f"
            done
          fi
