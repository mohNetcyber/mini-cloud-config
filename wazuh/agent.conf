<agent_config>

  <!-- Buffer agent - reglages par defaut, adaptes a l'echelle du projet -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Rootcheck - detection de rootkits (complementaire au SCA, pas redondant) -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
    <system_audit>/var/ossec/etc/shared/system_audit_rcl.txt</system_audit>
    <system_audit>/var/ossec/etc/shared/system_audit_ssh.txt</system_audit>
    <!-- cis_debian_linux_rcl.txt retire : mauvaise distribution (Debian, pas Ubuntu)
         et redondant avec le module SCA (cis_ubuntu22-04.yml) -->
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <!-- FIM : surveillance de fichiers sensibles -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Fichiers sensibles surveillés en temps réel -->
    <directories check_all="yes" realtime="yes">/etc/passwd</directories>
    <directories check_all="yes" realtime="yes">/etc/ssh/sshd_config</directories>

    <!-- Couverture large et periodique (systeme) -->
    <directories>/etc,/usr/bin,/usr/sbin</directories>
    <directories>/bin,/sbin,/boot</directories>

    <!-- Couverture ciblee et temps reel (specifique K3s) -->
    <directories check_all="yes" realtime="yes">/etc/rancher/k3s</directories>
    <directories check_all="yes">/var/lib/rancher/k3s/server/tls</directories>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/sys/kernel/security</ignore>
    <ignore>/sys/kernel/debug</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>

    <!-- Ne jamais journaliser le contenu (diff) des cles privees -->
    <nodiff>/etc/ssl/private.key</nodiff>
    <nodiff>/var/lib/rancher/k3s/server/tls/server-ca.key</nodiff>

    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <max_eps>100</max_eps>

    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <response_timeout>30</response_timeout>
      <queue_size>16384</queue_size>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- SCA : audit de conformite CIS -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- Active response : reponse automatique a certaines alertes -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
    <white_list>127.0.0.1</white_list>
    <white_list>192.168.100.0/24</white_list>
  </active-response>

  <!-- Logs systeme standards -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Commandes periodiques utiles a la detection -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>
  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tan |grep LISTEN |grep -v 127.0.0.1 | sort</command>
    <frequency>360</frequency>
  </localfile>
  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 5</command>
    <frequency>360</frequency>
  </localfile>

  <!-- Logs specifiques K3s -->
  <localfile>
    <log_format>command</log_format>
    <command>journalctl -u k3s --no-pager -n 0 -f</command>
    <alias>k3s-service-log</alias>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/pods/*/*/*.log</location>
  </localfile>

  <!-- Inventaire logiciel - alimente le module Vulnerability Detection -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>24h</interval>
    <scan_on_start>yes</scan_on_start>
    <packages>yes</packages>
    <os>yes</os>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

</agent_config>
