groups:
  - name: mini-cloud-alerts
    rules:

      - alert: CPUUsageHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation CPU elevee sur {{ $labels.instance }}"

      - alert: PodNotRunning
        expr: kube_pod_status_phase{phase!="Running", phase!="Succeeded"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} en phase {{ $labels.phase }}"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cible {{ $labels.job }} ({{ $labels.instance }}) injoignable"

      - alert: HighMemoryUsage
        expr: sum(container_memory_usage_bytes{image!=""}) by (pod) > 500000000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Consommation memoire elevee sur le pod {{ $labels.pod }}"
                   