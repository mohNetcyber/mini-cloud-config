apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-test-route
  namespace: default
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure # TRÈS IMPORTANT : Force l'association avec l'écouteur HTTPS

  hostnames:
    - "app-test.minicloud.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /       # Indique à Traefik d'intercepter tout le site
      backendRefs:
        - name: app-test-service
          port: 80