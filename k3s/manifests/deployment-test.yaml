apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-test
  labels:
    app: app-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-test
  template:
    metadata:
      labels:
        app: app-test
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app-test
          image: ghcr.io/mohnetcyber/mini-cloud-config:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: app-test-service
spec:
  type: NodePort
  selector:
    app: app-test
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080