apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-test-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: app-test
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 5000
        